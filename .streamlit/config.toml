[theme]
base = "dark"
primaryColor = "#38e881"
backgroundColor = "#050a08"
secondaryBackgroundColor = "#09110d"
textColor = "#e8f4ec"
# Theme fonts feed Glide data grids (st.dataframe) — CSS alone cannot.
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"

[client]
# Keep each Cloud entrypoint standalone — don't surface sibling pages/ links in the sidebar.
# Apps can still use st.sidebar for their own controls.
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
