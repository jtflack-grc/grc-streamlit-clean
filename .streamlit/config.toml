[theme]
base = "dark"
primaryColor = "#38e881"
backgroundColor = "#050a08"
secondaryBackgroundColor = "#09110d"
textColor = "#e8f4ec"
font = "sans serif"

[client]
# Keep each Cloud entrypoint standalone — don't surface sibling pages/ links in the sidebar.
# Apps can still use st.sidebar for their own controls.
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
